const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

const lensImg = new Image();
lensImg.src = LENS_IMG_SRC;

// Standard MediaPipe FaceMesh eye-contour index sets (open-eye outline, used to
// clip the lens so it only ever draws inside the user's real eye opening).
const RIGHT_EYE = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const LEFT_EYE  = [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
// Iris landmark sets (center + 4 boundary points) from the attention-mesh model.
const RIGHT_IRIS = { center: 468, ring: [469,470,471,472] };
const LEFT_IRIS  = { center: 473, ring: [474,475,476,477] };

let faceLandmarker = null;
let running = false;

async function setup() {
  statusEl.textContent = "Loading face tracking model…";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU"
    },
    outputFaceBlendshapes: false,
    runningMode: "VIDEO",
    numFaces: 1
  });
}

async function startCamera() {
  startBtn.disabled = true;
  try {
    await setup();
    statusEl.textContent = "Requesting camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    statusEl.textContent = "Live — move your head slowly for best tracking.";
    running = true;
    requestAnimationFrame(loop);
  } catch (err) {
    statusEl.textContent = "Could not start: " + err.message;
    startBtn.disabled = false;
  }
}

function eyeRadiusFromRing(landmarks, iris, w, h) {
  const c = landmarks[iris.center];
  let sum = 0;
  for (const idx of iris.ring) {
    const p = landmarks[idx];
    sum += Math.hypot((p.x - c.x) * w, (p.y - c.y) * h);
  }
  return sum / iris.ring.length;
}

function drawLensOnEye(landmarks, eyeContourIdx, iris, w, h) {
  const c = landmarks[iris.center];
  const cx = c.x * w, cy = c.y * h;
  const r = eyeRadiusFromRing(landmarks, iris, w, h) * 2.15; // lens diameter vs iris radius

  ctx.save();
  ctx.beginPath();
  eyeContourIdx.forEach((idx, i) => {
    const p = landmarks[idx];
    const x = p.x * w, y = p.y * h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.clip(); // restrict drawing to the user's real open-eye shape

  ctx.globalAlpha = 0.88;
  ctx.drawImage(lensImg, cx - r / 2, cy - r / 2, r, r);
  ctx.restore();
}

function loop() {
  if (!running) return;
  const now = performance.now();
  const result = faceLandmarker.detectForVideo(video, now);

  ctx.save();
  ctx.scale(-1, 1);
  ctx.translate(-canvas.width, 0);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const lm = result.faceLandmarks[0];
    drawLensOnEye(lm, RIGHT_EYE, RIGHT_IRIS, canvas.width, canvas.height);
    drawLensOnEye(lm, LEFT_EYE, LEFT_IRIS, canvas.width, canvas.height);
  }
  ctx.restore();

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startCamera);
