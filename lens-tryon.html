<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lens Try-On Demo</title>
<style>
  html, body { margin:0; padding:0; background:#0b0b0d; color:#eee; font-family:-apple-system,Segoe UI,Roboto,sans-serif; height:100%; overflow:hidden; }
  #stage { position:relative; width:100vw; height:100vh; }
  video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  video { visibility:hidden; }
  #ui { position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.65)); }
  button { font-size:16px; padding:12px 22px; border-radius:999px; border:none; background:#fff; color:#111; font-weight:600; }
  #status { font-size:13px; opacity:.85; text-align:center; padding:0 20px; }
  #topbar { position:absolute; top:0; left:0; right:0; padding:14px 16px; z-index:5; font-size:14px; opacity:.9; background:linear-gradient(rgba(0,0,0,.55), transparent); }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="topbar">Lens try-on demo — SOL / Sky Medical</div>
  <div id="ui">
    <div id="status">Tap Start, allow camera access, and face the camera.</div>
    <button id="startBtn">Start camera</button>
  </div>
</div>

<script>
  // Surface any error visibly on the page — a silent module/script failure is
  // exactly what makes "Start" look like it does nothing on a phone with no
  // visible console.
  window.addEventListener("error", (e) => {
    const el = document.getElementById("status");
    if (el) el.textContent = "Error: " + (e.message || e.error || "unknown script error");
  });
  window.addEventListener("unhandledrejection", (e) => {
    const el = document.getElementById("status");
    if (el) el.textContent = "Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
  });
</script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

const lensImg = new Image();
lensImg.src = LENS_IMG_SRC;

// Standard MediaPipe FaceMesh eye-contour index sets (open-eye outline, used to
// clip the lens so it only ever draws inside the user's real eye opening).
const RIGHT_EYE = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const LEFT_EYE  = [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
// Iris landmark sets (center + 4 boundary points) from the attention-mesh model.
const RIGHT_IRIS = { center: 468, ring: [469,470,471,472] };
const LEFT_IRIS  = { center: 473, ring: [474,475,476,477] };

let faceLandmarker = null;
let running = false;

// Iris landmarks give iris RADIUS, so 2x that is the iris DIAMETER — the
// true size of the visible colored part of the eye. A real colored contact
// sits almost exactly on the iris with only a hair of overlap onto the
// sclera, so keep this close to 2.0 rather than the old 1.9 (undersized,
// left a visible ring of real iris showing) or something like 2.5+
// (oversized, covers eyelid/sclera and looks pasted-on). Tune here if a
// given lens PNG still reads slightly big/small.
const LENS_TO_IRIS_DIAMETER_RATIO = 2.05;

async function setup() {
  statusEl.textContent = "Loading face tracking model…";
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const base = {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
    },
    outputFaceBlendshapes: false,
    runningMode: "VIDEO",
    numFaces: 1
  };
  try {
    // GPU delegate is faster but unsupported in some mobile Safari versions
    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
      ...base, baseOptions: { ...base.baseOptions, delegate: "GPU" }
    });
  } catch (e) {
    statusEl.textContent = "GPU mode unavailable, falling back to CPU…";
    faceLandmarker = await FaceLandmarker.createFromOptions(fileset, {
      ...base, baseOptions: { ...base.baseOptions, delegate: "CPU" }
    });
  }
}

async function startCamera() {
  startBtn.disabled = true;
  try {
    await setup();
    statusEl.textContent = "Requesting camera…";
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    statusEl.textContent = "Live — move your head slowly for best tracking.";
    running = true;
    requestAnimationFrame(loop);
  } catch (err) {
    statusEl.textContent = "Could not start: " + err.message;
    startBtn.disabled = false;
  }
}

function irisCenterAndRadius(landmarks, iris, w, h) {
  // Compute the center as the average of the 4 documented boundary points
  // rather than trusting a single "center" index — more robust across
  // MediaPipe model/version differences.
  let sx = 0, sy = 0;
  for (const idx of iris.ring) {
    sx += landmarks[idx].x * w;
    sy += landmarks[idx].y * h;
  }
  const cx = sx / iris.ring.length, cy = sy / iris.ring.length;
  let sum = 0;
  for (const idx of iris.ring) {
    const p = landmarks[idx];
    sum += Math.hypot(p.x * w - cx, p.y * h - cy);
  }
  return { cx, cy, r: sum / iris.ring.length };
}

// --- Ambient-light sensing ---------------------------------------------
// The lens PNG is a flat, evenly-lit asset, so drawn as-is it looks like it's
// glowing from within regardless of the room. To make it read as a physical
// object sitting on the eye, we sample the average luminance of the live
// camera frame every tick and use it to scale how bright/dark the lens is
// drawn — a small offscreen canvas keeps the sampling cheap.
const liteCanvas = document.createElement("canvas");
liteCanvas.width = 24;
liteCanvas.height = 16;
const liteCtx = liteCanvas.getContext("2d", { willReadFrequently: true });

let ambientLevel = 0.5;      // smoothed 0..1 scene brightness, updated per frame
const AMBIENT_SMOOTHING = 0.12; // exponential moving average factor (lower = smoother/slower)

function sampleAmbientBrightness() {
  liteCtx.drawImage(video, 0, 0, liteCanvas.width, liteCanvas.height);
  const { data } = liteCtx.getImageData(0, 0, liteCanvas.width, liteCanvas.height);
  let sum = 0;
  const pixelCount = data.length / 4;
  for (let i = 0; i < data.length; i += 4) {
    // Perceptual luminance (Rec. 601)
    sum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  const raw = (sum / pixelCount) / 255; // 0 (black) .. 1 (white)
  ambientLevel += (raw - ambientLevel) * AMBIENT_SMOOTHING;
  return ambientLevel;
}

function drawLensOnEye(landmarks, eyeContourIdx, iris, w, h, ambient) {
  const { cx, cy, r: radius } = irisCenterAndRadius(landmarks, iris, w, h);
  const r = radius * LENS_TO_IRIS_DIAMETER_RATIO; // lens size pinned to the user's actual measured iris

  ctx.save();
  ctx.beginPath();
  eyeContourIdx.forEach((idx, i) => {
    const p = landmarks[idx];
    const x = p.x * w, y = p.y * h;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.clip(); // restrict drawing to the user's real open-eye shape

  // Map ambient scene brightness (0..1) to a lens brightness multiplier and
  // opacity. In a dark room the lens should sit closer to ~0.5x brightness
  // and read more translucent; in bright light it should approach its full
  // native brightness (and a touch beyond, like a real glossy lens catching
  // light) instead of a flat, scene-independent shine.
  const brightnessFactor = 0.45 + ambient * 1.05; // ~0.45 (dark) .. ~1.5 (bright)
  const alpha = 0.62 + ambient * 0.28;            // ~0.62 (dark) .. ~0.9 (bright)

  ctx.filter = `brightness(${brightnessFactor.toFixed(3)})`;
  ctx.globalAlpha = Math.min(0.92, alpha);
  ctx.drawImage(lensImg, cx - r / 2, cy - r / 2, r, r);
  ctx.filter = "none";
  ctx.restore();
}

function loop() {
  if (!running) return;
  const now = performance.now();
  const result = faceLandmarker.detectForVideo(video, now);

  ctx.save();
  ctx.scale(-1, 1);
  ctx.translate(-canvas.width, 0);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const ambient = sampleAmbientBrightness();
    const lm = result.faceLandmarks[0];
    drawLensOnEye(lm, RIGHT_EYE, RIGHT_IRIS, canvas.width, canvas.height, ambient);
    drawLensOnEye(lm, LEFT_EYE, LEFT_IRIS, canvas.width, canvas.height, ambient);
  }
  ctx.restore();

  requestAnimationFrame(loop);
}

startBtn.addEventListener("click", startCamera);
</script>
